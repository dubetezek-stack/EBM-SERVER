<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="EBM SERVER - Acesse seus arquivos de rede pelo navegador">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#191919">
  <title>EBM SERVER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=103">
  <script>
  // Global error handler - shows JS errors on screen for mobile debugging
  window.onerror = function(msg, url, line, col, error) {
    var el = document.getElementById('js-error');
    if (el) {
      el.style.display = 'block';
      el.innerHTML += '<div>[ERRO] ' + msg + ' em ' + (url||'').split('/').pop() + ':' + line + '</div>';
    }
    return false;
  };

  // Preload wallpapers in background after initial load
  window.addEventListener('load', function() {
    setTimeout(function() {
      // Preload the first 22 system wallpapers
      for (var i = 1; i <= 22; i++) {
        var img = new Image();
        img.src = '/wallpapers/' + i + '.jpg';
      }
    }, 1500); // Wait 1.5s after load to not block login UI
  });
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="js-error" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#d32f2f;color:#fff;padding:12px;font-size:11px;z-index:9999;font-family:monospace;max-height:30vh;overflow:auto"></div>
  <script src="js/jsmpeg.min.js"></script>
  <script src="js/api.js?v=120"></script>
  <script src="js/icons.js?v=120"></script>
  <script src="js/utils.js?v=120"></script>
  <script src="js/views.js?v=120"></script>
  <script src="js/logs.js?v=120"></script>
  <script src="js/config.js?v=120"></script>
  <script src="js/app.js?v=120"></script>
</body>
</html>
