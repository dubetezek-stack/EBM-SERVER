<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Web File Explorer - Acesse seus arquivos de rede pelo navegador">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#191919">
  <title>Web File Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=68">
  <script>
  // Global error handler - shows JS errors on screen for mobile debugging
  window.onerror = function(msg, url, line, col, error) {
    var el = document.getElementById('js-error');
    if (el) {
      el.style.display = 'block';
      el.innerHTML += '<div>[ERRO] ' + msg + ' em ' + (url||'').split('/').pop() + ':' + line + '</div>';
    }
    return false;
  };
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="js-error" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#d32f2f;color:#fff;padding:12px;font-size:11px;z-index:9999;font-family:monospace;max-height:30vh;overflow:auto"></div>
  <div id="preview-modal" class="modal-overlay hidden">
    <div class="modal-backdrop"></div>
    <div class="preview-container">
      <div class="preview-header">
        <span id="preview-title"></span>
        <div class="preview-actions">
          <button id="preview-download" class="btn-icon" title="Download">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button id="preview-close" class="btn-icon" title="Fechar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="preview-content" class="preview-body"></div>
    </div>
  </div>
  <script src="js/jsmpeg.min.js"></script>
  <script src="js/api.js?v=68"></script>
  <script src="js/icons.js?v=68"></script>
  <script src="js/utils.js?v=68"></script>
  <script src="js/views.js?v=68"></script>
  <script src="js/logs.js?v=68"></script>
  <script src="js/config.js?v=68"></script>
  <script src="js/app.js?v=68"></script>
</body>
</html>
